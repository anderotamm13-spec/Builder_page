<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
              name="description"
                  content="Andero Tamm  14 y/o developer from Estonia who likes coding and electronics."
                />

      <title>Andero Tamm — Builder</title>

      <style>
              :root {
                  --bg: #05070b;
                  --panel: rgba(12, 17, 26, 0.72);
                  --text: #f5f7fb;
                  --muted: #9aa7b7;
                  --line: rgba(255, 255, 255, 0.09);

                  --accent: #64f4ff;
                  --accent-2: #7c5cff;
                  --success: #8dffb0;

                  --radius: 22px;
              }

                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }

                      html {
                          scroll-behavior: smooth;
                      }

                          body {
                              min-height: 100vh;

                              font-family: Inter,
                              ui-sans-serif,
                              system-ui,
                              -apple-system,
                              BlinkMacSystemFont,
                              "Segoe UI",
                              sans-serif;

                              color: var(--text);

                              background: radial-gradient(
                                      circle at 15% 15%,
                                      rgba(124, 92, 255, 0.15),
                                      transparent 28%
                              ),
                              radial-gradient(
                                      circle at 85% 20%,
                                      rgba(100, 244, 255, 0.11),
                                      transparent 24%
                              ),
                              radial-gradient(
                                      circle at 50% 100%,
                                      rgba(57, 255, 174, 0.07),
                                      transparent 30%
                              ),
                              var(--bg);

                              overflow-x: hidden;
                          }

                              body::before {
                                  content: "";
                                  position: fixed;
                                  inset: 0;
                                  pointer-events: none;

                                  opacity: 0.22;

                                  background-image: linear-gradient(
                                          rgba(255, 255, 255, 0.025) 1px,
                                          transparent 1px
                                  ),
                                  linear-gradient(
                                          90deg,
                                          rgba(255, 255, 255, 0.025) 1px,
                                          transparent 1px
                                  );

                                  background-size: 44px 44px;

                                  mask-image: linear-gradient(
                                          to bottom,
                                          black,
                                          transparent 95%
                                  );
                              }


                a {
                      text-decoration: none;
                      color: inherit;
                }

                    .page {
                          width: min(1120px, calc(100% - 34px));
                          margin: 0 auto;
                          padding: 28px 0 64px;

                          position: relative;
                          z-index: 1;
                    }

                        /* NAVIGATION */

                  nav {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;

                        padding: 10px 0 28px;
                  }

                      .brand {
                            display: flex;
                            align-items: center;
                            gap: 12px;

                            font-weight: 700;
                            letter-spacing: 0.02em;
                      }

                          .mini-logo {
                                width: 38px;
                                height: 38px;

                                display: grid;
                                place-items: center;

                                border: 1px solid rgba(100, 244, 255, 0.3);
                                border-radius: 12px;

                                background: linear-gradient(
                                        145deg,
                                        rgba(100, 244, 255, 0.12),
                                        rgba(124, 92, 255, 0.12)
                                );

                                box-shadow: inset 0 0 18px rgba(100, 244, 255, 0.05),
                                0 0 24px rgba(124, 92, 255, 0.08);

                                font-weight: 900;
                          }

                              .nav-links {
                                    display: flex;
                                    gap: 8px;
                                    flex-wrap: wrap;
                              }

                                  .nav-links a {
                                        padding: 10px 13px;

                                        color: var(--muted);

                                        border-radius: 12px;

                                        font-size: 0.94rem;

                                        transition: 0.2s ease;
                                  }

                                      .nav-links a:hover {
                                            color: white;
                                            background: rgba(255, 255, 255, 0.05);
                                      }

                                          /* HERO */

                  .hero {
                        min-height: 68vh;

                        display: grid;
                        grid-template-columns: 1.35fr 0.65fr;
                        align-items: center;

                        gap: 54px;

                        padding: 46px 0 66px;
                  }

                      .eyebrow {
                            display: inline-flex;
                            align-items: center;
                            gap: 9px;

                            padding: 8px 12px;
                            margin-bottom: 24px;

                            border-radius: 999px;

                            border: 1px solid rgba(141, 255, 176, 0.18);

                            background: rgba(141, 255, 176, 0.05);

                            color: #caffd8;

                            font-size: 0.86rem;
                      }

                          .dot {
                                width: 8px;
                                height: 8px;

                                border-radius: 50%;

                                background: var(--success);

                                box-shadow: 0 0 14px rgba(141, 255, 176, 0.8);
                          }

                              h1 {
                                    max-width: 820px;

                                    font-size: clamp(3rem, 7vw, 6.4rem);
                                    line-height: 0.94;

                                    letter-spacing: -0.06em;
                              }

                                  .gradient-text {
                                        background: linear-gradient(
                                                90deg,
                                                #ffffff 0%,
                                                #a6fbff 46%,
                                                #9d88ff 100%
                                        );

                                        -webkit-background-clip: text;
                                        background-clip: text;

                                        color: transparent;
                                  }

                                      .intro {
                                            max-width: 700px;

                                            margin-top: 26px;

                                            color: #bac3cf;

                                            font-size: clamp(1.05rem, 2vw, 1.28rem);
                                            line-height: 1.7;
                                      }

                                          .hero-actions {
                                                display: flex;
                                                gap: 12px;
                                                flex-wrap: wrap;

                                                margin-top: 32px;
                                          }

                                              .btn {
                                                    min-height: 48px;

                                                    display: inline-flex;
                                                    align-items: center;
                                                    justify-content: center;

                                                    gap: 10px;

                                                    padding: 0 18px;

                                                    border-radius: 14px;

                                                    border: 1px solid var(--line);

                                                    background: rgba(255, 255, 255, 0.04);

                                                    color: white;

                                                    font-weight: 650;

                                                    transition: 0.2s ease;
                                              }

                                                  .btn:hover {
                                                        transform: translateY(-2px);

                                                        border-color: rgba(100, 244, 255, 0.3);

                                                        background: rgba(255, 255, 255, 0.07);
                                                  }

                                                      .btn.primary {
                                                            background: linear-gradient(
                                                                    135deg,
                                                                    rgba(100, 244, 255, 0.18),
                                                                    rgba(124, 92, 255, 0.2)
                                                            );

                                                            border-color: rgba(100, 244, 255, 0.28);

                                                            box-shadow: 0 0 34px rgba(100, 244, 255, 0.08);
                                                      }

                                                          /* LOGO */

                  .logo-wrap {
                        min-height: 320px;

                        display: grid;
                        place-items: center;

                        position: relative;
                  }

                      .logo-wrap::before,
                          .logo-wrap::after {
                            content: "";

                            position: absolute;

                            border-radius: 50%;
                      }

                          .logo-wrap::before {
                                width: 290px;
                                height: 290px;

                                border: 1px solid rgba(100, 244, 255, 0.13);

                                animation: spin 18s linear infinite;
                          }

                              .logo-wrap::after {
                                    width: 235px;
                                    height: 235px;

                                    border: 1px dashed rgba(124, 92, 255, 0.2);

                                    animation: spinReverse 14s linear infinite;
                              }

                                  .big-logo {
                                        width: 185px;
                                        aspect-ratio: 1;

                                        display: grid;
                                        place-items: center;

                                        position: relative;
                                        z-index: 2;

                                        overflow: hidden;

                                        border-radius: 38px;

                                        border: 1px solid rgba(255, 255, 255, 0.13);

                                        background: linear-gradient(
                                                145deg,
                                                rgba(255, 255, 255, 0.08),
                                                rgba(255, 255, 255, 0.015)
                                        ),
                                        #090d14;

                                        box-shadow: inset 0 0 40px rgba(100, 244, 255, 0.05),
                                        0 0 60px rgba(100, 244, 255, 0.1),
                                        0 0 110px rgba(124, 92, 255, 0.08);

                                        font-size: 4.2rem;
                                        font-weight: 950;

                                        letter-spacing: -0.09em;
                                  }

                                      .big-logo::before {
                                            content: "";

                                            position: absolute;
                                            inset: 0;

                                            background: linear-gradient(
                                                    120deg,
                                                    transparent 28%,
                                                    rgba(100, 244, 255, 0.12),
                                                    transparent 65%
                                            );

                                            transform: translateX(-120%);

                                            animation: shine 4.8s ease-in-out infinite;
                                      }

                                          .big-logo span {
                                                position: relative;
                                                z-index: 2;

                                                background: linear-gradient(
                                                        135deg,
                                                        white 20%,
                                                        #86f8ff 55%,
                                                        #9581ff
                                                );

                                                -webkit-background-clip: text;
                                                background-clip: text;

                                                color: transparent;
                                          }

                                              /* SECTIONS */

                  .section {
                        padding: 70px 0 12px;
                  }

                      .section-head {
                            margin-bottom: 26px;
                      }

                          .section-label {
                                margin-bottom: 10px;

                                color: var(--accent);

                                font-family: ui-monospace,
                                SFMono-Regular,
                                Menlo,
                                Monaco,
                                Consolas,
                                monospace;

                                font-size: 0.82rem;

                                letter-spacing: 0.12em;
                                text-transform: uppercase;
                          }

                              h2 {
                                    font-size: clamp(2rem, 4vw, 3.2rem);

                                    letter-spacing: -0.04em;
                              }

                                  .muted {
                                        margin-top: 10px;

                                        color: var(--muted);

                                        line-height: 1.7;
                                  }

                                      /* SKILLS */

                  .skills {
                        display: flex;
                        flex-wrap: wrap;

                        gap: 10px;

                        margin-top: 24px;
                  }

                      .chip {
                            padding: 10px 13px;

                            border-radius: 12px;

                            border: 1px solid var(--line);

                            background: rgba(255, 255, 255, 0.035);

                            color: #dfe6ef;

                            font-family: ui-monospace,
                            SFMono-Regular,
                            Menlo,
                            Monaco,
                            Consolas,
                            monospace;

                            font-size: 0.91rem;
                      }

                          /* PROJECT */

                  .project {
                        margin-top: 26px;

                        overflow: hidden;

                        border: 1px solid var(--line);

                        border-radius: var(--radius);

                        background: linear-gradient(
                                150deg,
                                rgba(15, 22, 34, 0.9),
                                rgba(8, 12, 19, 0.82)
                        );

                        box-shadow: 0 0 40px rgba(100, 244, 255, 0.08);

                        transition: 0.25s ease;
                  }

                      .project:hover {
                            transform: translateY(-4px);

                            border-color: rgba(100, 244, 255, 0.22);

                            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28),
                            0 0 50px rgba(100, 244, 255, 0.07);
                      }

                          .project-visual {
                                min-height: 260px;

                                padding: 26px;

                                position: relative;

                                overflow: hidden;

                                border-bottom: 1px solid var(--line);

                                background: radial-gradient(
                                        circle at 70% 35%,
                                        rgba(100, 244, 255, 0.15),
                                        transparent 22%
                                ),
                                radial-gradient(
                                        circle at 36% 60%,
                                        rgba(124, 92, 255, 0.17),
                                        transparent 26%
                                ),
                                #070b12;
                          }

                              .project-visual::before {
                                    content: "";

                                    position: absolute;
                                    inset: 0;

                                    opacity: 0.18;

                                    background-image: linear-gradient(
                                            rgba(100, 244, 255, 0.15) 1px,
                                            transparent 1px
                                    ),
                                    linear-gradient(
                                            90deg,
                                            rgba(100, 244, 255, 0.15) 1px,
                                            transparent 1px
                                    );

                                    background-size: 28px 28px;
                              }

                                  /* FAKE TERMINAL */

                  .terminal {
                        width: min(620px, 100%);

                        margin: 18px auto 0;

                        position: relative;
                        z-index: 1;

                        overflow: hidden;

                        border: 1px solid rgba(255, 255, 255, 0.1);

                        border-radius: 16px;

                        background: rgba(3, 7, 12, 0.88);

                        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.45);
                  }

                      .terminal-top {
                            height: 38px;

                            display: flex;
                            align-items: center;

                            gap: 7px;

                            padding: 0 13px;

                            border-bottom: 1px solid var(--line);

                            background: rgba(255, 255, 255, 0.035);
                      }

                          .terminal-top i {
                                width: 9px;
                                height: 9px;

                                border-radius: 50%;

                                background: rgba(255, 255, 255, 0.18);
                          }

                              .terminal-body {
                                    padding: 20px;

                                    color: #cbd6e2;

                                    font-family: ui-monospace,
                                    SFMono-Regular,
                                    Menlo,
                                    Monaco,
                                    Consolas,
                                    monospace;

                                    font-size: clamp(0.82rem, 1.8vw, 0.98rem);

                                    line-height: 1.7;
                              }

                                  .cyan {
                                        color: var(--accent);
                                  }

                                      .purple {
                                            color: #b1a4ff;
                                      }

                                          .green {
                                                color: var(--success);
                                          }

                                              .project-info {
                                                    display: grid;
                                                    grid-template-columns: 1fr auto;

                                                    align-items: center;

                                                    gap: 24px;

                                                    padding: 28px;
                                              }


                  }
                                            )
                              }
                                        )
                      }
                                )
                  }
                                                        )
                                          }
                                                    )
                                      }
                                                )
                  }
                                                                    )
                                      }
                                                )
                              }
                                        )
                }
