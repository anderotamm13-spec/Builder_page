<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
              name="description"
                  content="Andero Tamm  14 y/o developer from Estonia who likes coding and electronics."
                />

      <title>Andero Tamm — Builder</title>

      <style>
              :root {
                  --bg: #05070b;
                  --panel: rgba(12, 17, 26, 0.72);
                  --text: #f5f7fb;
                  --muted: #9aa7b7;
                  --line: rgba(255, 255, 255, 0.09);

                  --accent: #64f4ff;
                  --accent-2: #7c5cff;
                  --success: #8dffb0;

                  --radius: 22px;
              }

                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }

                      html {
                          scroll-behavior: smooth;
                      }

                          body {
                              min-height: 100vh;

                              font-family: Inter,
                              ui-sans-serif,
                              system-ui,
                              -apple-system,
                              BlinkMacSystemFont,
                              "Segoe UI",
                              sans-serif;

                              color: var(--text);

                              background: radial-gradient(
                                      circle at 15% 15%,
                                      rgba(124, 92, 255, 0.15),
                                      transparent 28%
                              ),
                              radial-gradient(
                                      circle at 85% 20%,
                                      rgba(100, 244, 255, 0.11),
                                      transparent 24%
                              ),
                              radial-gradient(
                                      circle at 50% 100%,
                                      rgba(57, 255, 174, 0.07),
                                      transparent 30%
                              ),
                              var(--bg);

                              overflow-x: hidden;
                          }

                              body::before {
                                  content: "";
                                  position: fixed;
                                  inset: 0;
                                  pointer-events: none;

                                  opacity: 0.22;

                                  background-image: linear-gradient(
                                          rgba(255, 255, 255, 0.025) 1px,
                                          transparent 1px
                                  ),
                                  linear-gradient(
                                          90deg,
                                          rgba(255, 255, 255, 0.025) 1px,
                                          transparent 1px
                                  );

                                  background-size: 44px 44px;

                                  mask-image: linear-gradient(
                                          to bottom,
                                          black,
                                          transparent 95%
                                  );
                              }

                                  a {
                                      text-decoration: none;
                                      color: inherit;
                                  }

                                      .page {

                                  }
                                          )
                              }
                                      )
              }
      </style></title>
</head>
</html>
